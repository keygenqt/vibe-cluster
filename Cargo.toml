[package]
name = "vibe-cluster"
version = "0.0.4"
edition = "2024"
license = "Apache-2.0"
description = "Multi-provider LLM cluster library for Rust."
repository = "https://gitcode.com/keygenqt_vz/vibe-cluster"
authors = ["Vitaliy Zarubin <keygenqt@yandex.ru"]
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.18.1", features = ["v4"] }
async-trait = "0.1.89"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
futures-util = "0.3"
once_cell = "1.19"
regex = "1.10"
