[package]
name = "vibe-cluster"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
description = "Multi-provider LLM cluster library for Rust."
repository = "https://gitcode.com/keygenqt_vz/vibe-cluster"
authors = ["Vitaliy Zarubin <keygenqt@yandex.ru>"]
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "charset",
    "http2",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.18.1", features = ["v4"] }
async-trait = "0.1.89"
tokio-util = "0.7"
futures-util = "0.3"
regex = "1.10"
log = "0.4"
tiktoken-rs = "0.12"
