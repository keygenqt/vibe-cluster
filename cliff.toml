# git-cliff configuration for Vibe Action
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to Vibe Action will be documented in this file.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits | unique(attribute="message") %}
  - {{ commit.message | upper_first }}\
{% if commit.breaking %} **BREAKING**{% endif %}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
commit_preprocessors = [
  # GitLab MR / GitHub PR merge commits are not conventional — rewrite then skip via chore.
  { pattern = "^!\\d+ merge", replace = "chore: merge branch" },
  { pattern = "^Merge pull request #\\d+ from", replace = "chore: merge branch" },
]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat:", group = "🚀 Features" },
  { message = "^fix:", group = "🐛 Fixes" },
  { message = "^refactor:", group = "⚡ Refactoring" },
  { message = "^docs:", group = "📚 Documentation" },
  { message = "^doc:", group = "📚 Documentation" },
  { message = "^perf:", group = "⚡ Performance" },
  { message = "^test:", group = "🧪 Tests" },
  { message = "^chore:", group = "🔧 Chores", skip = true },
]
filter_commits = true
tag_pattern = "v[0-9].*"
